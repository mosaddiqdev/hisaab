<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Hisaab link preview</title>
<!-- Source of assets/og-image.png (1200x630). Build: node scripts/build-og.mjs (it fills in the phone screenshot).
     What it must do, from the research: a headline big enough to read at ~400px wide, the brand mark, one real product visual,
     all inside the central 1080x600 with 60px+ to every edge. The phone may bleed off the bottom: it is decoration, the content is above.
     Fonts are self-hosted (../fonts) so this builds offline and always matches the app. Keep the PNG under WhatsApp's 300 KB. -->
<link rel="stylesheet" href="../css/fonts.css">
<style>
:root{--bg:#faf9f6;--ink:#1c1c1e;--muted:#6b6b6f;--accent:#5b8fd9}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{position:relative;font-family:'Inter',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;background:
  radial-gradient(640px 640px at 83% 42%,#e3ecfa 0%,rgba(227,236,250,0) 72%),
  radial-gradient(620px 420px at 0% 100%,#f7ece7 0%,rgba(247,236,231,0) 70%),var(--bg)}
.brand{position:absolute;left:96px;top:70px;display:flex;align-items:center;gap:14px}
.brand img{width:52px;height:52px;border-radius:13px;box-shadow:0 6px 16px -6px rgba(28,28,30,.45)}
.brand b{font:500 38px/1 'Fraunces',Georgia,serif;font-variation-settings:'SOFT' 100;letter-spacing:-.02em}
h1{position:absolute;left:92px;top:168px;font:500 92px/1.02 'Fraunces',Georgia,serif;font-variation-settings:'SOFT' 100;letter-spacing:-.032em}
h1 em{position:relative;font-style:normal;color:var(--accent)}
h1 em svg{position:absolute;left:2%;bottom:-6px;width:96%;height:16px;overflow:visible}
.sub{position:absolute;left:96px;top:392px;width:600px;font:500 32px/1.38 'Inter';color:var(--muted);letter-spacing:-.005em}
.foot{position:absolute;left:96px;top:546px;display:flex;align-items:center;gap:14px;font:500 21px/1 'Inter';color:#86868a}
.foot i{width:4px;height:4px;border-radius:50%;background:#c5c2ba}
.foot .hi{font-family:'Hind','Noto Sans Devanagari',sans-serif;font-size:23px}
.foot .as{font-family:'Hind Siliguri','Noto Sans Bengali',sans-serif;font-size:23px}
.phone{position:absolute;left:790px;top:86px;width:344px;height:700px;padding:9px;border-radius:56px;background:#1c1c1e;
  box-shadow:0 0 0 1.5px #3b3b3e,0 50px 80px -28px rgba(28,28,30,.42),0 18px 30px -18px rgba(28,28,30,.35)}
.screen{position:relative;height:100%;border-radius:47px;overflow:hidden;background:var(--bg)}
.screen img{display:block;width:100%;margin-top:30px} /* room for the notch: it must never cover the app's title */
.screen::after{content:"";position:absolute;left:50%;top:9px;width:84px;height:23px;margin-left:-42px;border-radius:12px;background:#1c1c1e}
</style></head>
<body>
  <div class="brand"><img src="../icons/icon.svg" alt=""><b>Hisaab</b></div>
  <h1>Your milk bill,<br><em>sorted.<svg viewBox="0 0 300 16" preserveAspectRatio="none"><path d="M3 11 C 55 2, 110 15, 168 7 S 266 4, 297 10" fill="none" stroke="#5b8fd9" stroke-width="5.5" stroke-linecap="round"/></svg></em></h1>
  <p class="sub">Tap a day when it’s different.<br>Share the total with your milkman.</p>
  <div class="foot"><span>No account</span><i></i><span>Works offline</span><i></i><span>English</span><i></i><span class="hi">हिंदी</span><i></i><span class="as">অসমীয়া</span></div>
  <div class="phone"><div class="screen"><img id="shot" alt=""></div></div>
</body></html>
