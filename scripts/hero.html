<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Hisaab README hero</title>
<!-- Source of assets/hero.png, the picture at the top of README.md. Built by scripts/build-screenshots.mjs, which fills in the two screenshots.
     The corners are transparent so the card looks right on GitHub's light and dark themes. -->
<link rel="stylesheet" href="../css/fonts.css">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1400px;height:760px;background:transparent;overflow:hidden}
.card{position:relative;width:1400px;height:760px;border-radius:30px;overflow:hidden;font-family:'Inter',system-ui,sans-serif;background:
  radial-gradient(800px 560px at 88% 12%,#e3ecfa 0%,rgba(227,236,250,0) 70%),
  radial-gradient(700px 480px at 6% 100%,#f7ece7 0%,rgba(247,236,231,0) 70%),#faf9f6;box-shadow:inset 0 0 0 1px #e5e2db}
.browser{position:absolute;left:104px;top:72px;width:960px;border-radius:16px;overflow:hidden;background:#fff;
  box-shadow:0 0 0 1px #dcd8ce,0 40px 70px -30px rgba(28,28,30,.30),0 12px 24px -12px rgba(28,28,30,.15)}
.bar{height:46px;background:#f3f1ec;border-bottom:1px solid #e5e2db;display:flex;align-items:center;padding:0 18px;position:relative}
.dots{display:flex;gap:8px}.dots i{width:12px;height:12px;border-radius:50%;background:#d9d5cb}
.url{position:absolute;left:50%;top:9px;width:340px;height:28px;margin-left:-170px;border-radius:14px;background:#fff;border:1px solid #e5e2db;
  font:500 14px/26px 'Inter';color:#6b6b6f;text-align:center}
.browser img{display:block;width:100%}
.phone{position:absolute;left:1000px;top:96px;width:292px;padding:8px;border-radius:48px;background:#1c1c1e;
  box-shadow:0 0 0 1.5px #3b3b3e,0 50px 80px -28px rgba(28,28,30,.45),0 18px 30px -18px rgba(28,28,30,.35)}
.phone img{display:block;width:100%;border-radius:40px}
</style></head>
<body><div class="card">
  <div class="browser"><div class="bar"><div class="dots"><i></i><i></i><i></i></div><div class="url">tryhisaab.netlify.app</div></div><img id="desktop" alt=""></div>
  <div class="phone"><img id="mobile" alt=""></div>
</div></body></html>
